<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciamento de Itens da Nota</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Gerenciamento de Itens da Nota</h2>
        <form action="#" method="post">
            <div class="form-wrapper">
                <div class="fields-column">
                    <div class="form-group">
                        <label for="cd_item">Cd Item</label>
                        <input type="text" id="cd_item" name="cd_item">
                    </div>
                    <div class="form-group">
                        <label for="cod_produto">Cod Produto</label>
                        <input type="text" id="cod_produto" name="cod_produto">
                    </div>
                    <div class="form-group">
                        <label for="qt_produto">Qt Produto</label>
                        <input type="text" id="qt_produto" name="qt_produto">
                    </div>
                    <div class="form-group">
                        <label for="vl_total_itam">Vl Total Itam</label>
                        <input type="text" id="vl_total_itam" name="vl_total_itam">
                    </div>
                </div>
                <div class="button-column">
                    <button type="submit" class="btn-salvar">SALVAR</button>
                </div>
            </div>
        </form>
        <div class="nav-links">
            <a href="home.html">Voltar para Home</a>
        </div>
    </div>
</body>
</html>
