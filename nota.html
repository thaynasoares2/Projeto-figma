<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciamento de Nota</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Gerenciamento de Nota</h2>
        <form action="#" method="post">
            <div class="form-wrapper">
                <div class="fields-column">
                    <div class="form-group">
                        <label for="dt_emissao">Dt Emissão</label>
                        <input type="text" id="dt_emissao" name="dt_emissao">
                    </div>
                    <div class="form-group">
                        <label for="dt_envio">Dt Envio</label>
                        <input type="text" id="dt_envio" name="dt_envio">
                    </div>
                    <div class="form-group">
                        <label for="vl_total">Vl Total</label>
                        <input type="text" id="vl_total" name="vl_total">
                    </div>
                    <div class="form-group">
                        <label for="cnpj_nota">CNPJ</label>
                        <input type="text" id="cnpj_nota" name="cnpj_nota">
                    </div>
                </div>
                <div class="button-column">
                    <button type="submit" class="btn-salvar">SALVAR</button>
                </div>
            </div>
        </form>
        <div class="nav-links">
            <a href="home.html">Voltar para Home</a>
        </div>
    </div>
</body>
</html>
